<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Nexus 极速跳转</title>
    <link rel="stylesheet" href="/assets/tailwind.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <!-- loading -->
    <div id="loader" class="text-center">
        <div class="inline-block w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full spin mb-4"></div>
        <p class="text-slate-400">正在获取最新配置...</p>
    </div>

    <!-- app -->
    <div id="app" class="max-w-md w-full hidden">
        <h2 class="text-3xl font-bold text-white text-center mb-8">
            Hello, <span id="userName" class="text-sky-400">User</span>
        </h2>
        <div id="groupsContainer"></div>
    </div>

<script>
(async function () {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const groupParam = params.get('group');
    const linkParam = params.get('link');

    const loader = document.getElementById('loader');
    const app = document.getElementById('app');

    let owner = "";
    let repo = "";
    const configApiPath = "/api/config";
    const configFilePath = 'dsfdsf234b235';
    const configCipherKey = 'NEXUS_LITE_2026';

    const utf8Encode = (str) => new TextEncoder().encode(str);
    const utf8Decode = (buf) => new TextDecoder().decode(buf);
    const xorBytes = (inputBytes, keyText) => {
        const keyBytes = utf8Encode(keyText);
        const out = new Uint8Array(inputBytes.length);
        for (let i = 0; i < inputBytes.length; i++) out[i] = inputBytes[i] ^ keyBytes[i % keyBytes.length];
        return out;
    };
    const base64ToBytes = (base64) => Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    const decryptConfigPayload = (payload) => {
        if (!payload || typeof payload !== 'object') return payload || {};
        if (payload.alg !== 'xor-base64' || !payload.data) return payload;
        const decrypted = xorBytes(base64ToBytes(payload.data), configCipherKey);
        return JSON.parse(utf8Decode(decrypted));
    };

    if (!id) {
        window.location.replace("./index.html");
        return;
    }

    const token = localStorage.getItem('NEXUS_GH_TOKEN_V2');

    async function loadRuntimeConfig() {
        const res = await fetch(`${configApiPath}?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error('运行时配置加载失败');
        const runtimeConfig = await res.json();
        owner = runtimeConfig.owner || '';
        repo = runtimeConfig.repo || '';
        return runtimeConfig;
    }

    async function fetchConfigFromGitHub() {
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${configFilePath}?v=${Date.now()}`;
        const headers = token ? { Authorization: `token ${token}` } : {};
        const res = await fetch(apiUrl, { headers });
        if (!res.ok) throw new Error("API 请求失败");
        const data = await res.json();
        return decryptConfigPayload(JSON.parse(decodeURIComponent(escape(atob(data.content)))));
    }

    try {
        const runtimeConfig = await loadRuntimeConfig();
        const config = token ? await fetchConfigFromGitHub() : decryptConfigPayload(runtimeConfig.config || {});
        const userData = config[id];

        if (!userData) {
            loader.textContent = '未找到 ID: ' + id;
            return;
        }

        // Resolve a single shared item link without showing its final destination.
        if (groupParam !== null || linkParam !== null) {
            if (!groupParam || !linkParam) {
                loader.textContent = '分享链接无效';
                return;
            }
            const selectedGroup = Object.prototype.hasOwnProperty.call(userData, groupParam)
                ? userData[groupParam]
                : null;
            const targetUrl = selectedGroup && Object.prototype.hasOwnProperty.call(selectedGroup, linkParam)
                ? selectedGroup[linkParam]
                : null;
            if (typeof targetUrl !== 'string' || !/^https?:\/\//i.test(targetUrl)) {
                loader.textContent = '分享链接不存在或已失效';
                return;
            }
            window.location.replace(targetUrl);
            return;
        }

        let allLinks = [];
        for (const group of Object.values(userData)) {
            for (const url of Object.values(group)) {
                if (url && url.startsWith('http')) allLinks.push(url);
            }
        }

        if (allLinks.length === 1) {
            window.location.replace(allLinks[0]);
            return;
        }

        renderUI(id, userData);

    } catch (err) {
        loader.innerHTML = `<p class="text-rose-400">系统错误: ${err.message}</p>`;
    }

    function buildItemJumpUrl(userId, groupName, linkName) {
        const jump = new URL('./goo.html', window.location.href);
        jump.searchParams.set('id', userId);
        jump.searchParams.set('group', groupName);
        jump.searchParams.set('link', linkName);
        return jump.toString();
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    function renderUI(userId, groups) {
        document.getElementById('userName').innerText = userId;
        const container = document.getElementById('groupsContainer');
        let html = '';

        for (const [groupName, links] of Object.entries(groups)) {
            const validLinks = Object.entries(links)
                .filter(([_, url]) => typeof url === 'string' && /^https?:\/\//i.test(url));

            if (validLinks.length === 0) continue;

            const linksHtml = validLinks.map(([name]) => {
                const jumpUrl = escapeHtml(buildItemJumpUrl(userId, groupName, name));
                const safeName = escapeHtml(name);
                return '<div class="flex items-center gap-3 px-4 py-3 ' +
                    'border border-slate-700 rounded-xl bg-slate-800 hover:border-sky-500 ' +
                    'transition-all mb-3">' +
                    '<a href="' + jumpUrl + '" class="flex-1 min-w-0 flex items-center justify-between gap-3 group">' +
                    '<span class="font-medium text-slate-200 truncate">' + safeName + '</span>' +
                    '<span class="text-slate-600 shrink-0 group-hover:text-sky-400">→</span>' +
                    '</a>' +
                    '<button type="button" data-copy-jump="' + jumpUrl + '" ' +
                    'class="shrink-0 px-3 py-2 rounded-lg bg-slate-700/70 text-xs text-slate-300 ' +
                    'hover:text-white hover:bg-sky-700 transition-colors">复制链接</button>' +
                    '</div>';
            }).join('');

            html += '<div class="mb-6">' +
                '<h3 class="text-xs font-bold text-slate-500 uppercase mb-3 tracking-widest">' +
                escapeHtml(groupName) +
                '</h3><div class="flex flex-col">' + linksHtml + '</div></div>';
        }

        container.innerHTML = html;
        container.querySelectorAll('[data-copy-jump]').forEach(button => {
            button.addEventListener('click', async () => {
                const jumpUrl = button.getAttribute('data-copy-jump');
                let copied = false;
                if (navigator.clipboard && window.isSecureContext) {
                    try {
                        await navigator.clipboard.writeText(jumpUrl);
                        copied = true;
                    } catch (_) {}
                }
                if (!copied) {
                    const area = document.createElement('textarea');
                    area.value = jumpUrl;
                    area.style.position = 'fixed';
                    area.style.left = '-9999px';
                    area.setAttribute('readonly', '');
                    document.body.appendChild(area);
                    area.focus();
                    area.select();
                    try { copied = document.execCommand('copy'); }
                    finally { document.body.removeChild(area); }
                }
                button.textContent = copied ? '已复制' : '复制失败';
                button.classList.toggle('text-emerald-400', copied);
                window.setTimeout(() => {
                    button.textContent = '复制链接';
                    button.classList.remove('text-emerald-400');
                }, 1800);
            });
        });

        loader.classList.add('hidden');
        app.classList.remove('hidden');
    }
})();
</script>

</body>
</html>
